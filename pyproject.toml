[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "localforge-installer"
version = "0.1.4"
description = "A local-first desktop installer for OpenClaw and GGUF inference"
requires-python = ">=3.12"
dependencies = ["PySide6==6.10.2", "httpx==0.28.1", "psutil==7.2.2", "platformdirs==4.9.2", "keyring==25.7.0", "packaging==26.0", "zstandard==0.25.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-qt==4.5.0", "respx==0.22.0", "pyinstaller==6.19.0", "ruff==0.15.4"]

[project.scripts]
localforge = "localforge.app:main"
localforge-setup = "localforge.setup_openclaw:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in network and real runtime tests"]

[tool.ruff]
line-length = 110
