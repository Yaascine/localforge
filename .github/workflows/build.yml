name: Native tests and packages
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - run: uv sync --frozen --extra dev
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3
      - name: Unit, integration and GUI tests
        run: uv run pytest -q -m "not live"
        env:
          QT_QPA_PLATFORM: offscreen
      - if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build native package
        run: uv run python packaging/build.py
      - name: Launch packaged GUI
        run: uv run python packaging/smoke.py
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: LocalForge-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*setup.exe
